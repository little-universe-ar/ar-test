<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    /*
      マーカーを一瞬見失っても、
      指定時間だけ最後の位置にARを残す
    */
    AFRAME.registerComponent('grace-visibility', {
      schema: {
        delay: {
          type: 'number',
          default: 800
        }
      },

      init: function () {
        this.markerFound = false;
        this.visibleUntil = 0;

        this.el.addEventListener('markerFound', () => {
          this.markerFound = true;
          this.visibleUntil = 0;
          this.el.object3D.visible = true;
        });

        this.el.addEventListener('markerLost', () => {
          this.markerFound = false;

          this.visibleUntil =
            performance.now() + this.data.delay;
        });
      },

      tick: function () {

        if (this.markerFound) {
          this.el.object3D.visible = true;
          return;
        }

        /*
          認識を失ってから0.8秒以内なら
          最後の位置で表示を維持
        */
        if (
          this.visibleUntil > 0 &&
          performance.now() < this.visibleUntil
        ) {
          this.el.object3D.visible = true;

        } else if (this.visibleUntil > 0) {

          this.el.object3D.visible = false;
        }
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .guide {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: rgba(0,0,0,.72);
      color: white;

      padding: 10px 16px;
      border-radius: 20px;

      font-family: sans-serif;
      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }
  </style>

</head>

<body>

<div class="guide">
  スマホを動かして館内MAPを見てみよう
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="
    trackingMethod: best;
    sourceType: webcam;
    debugUIEnabled: false;
    detectionMode: mono_and_matrix;
    matrixCodeType: 3x3;
  ">

  <a-assets>
    <img id="mapImage" src="ar-image.png">
  </a-assets>


  <!-- LUマーカー -->
  <a-marker
    type="pattern"
    url="marker.patt"

    smooth="true"
    smoothCount="20"
    smoothTolerance="0.02"
    smoothThreshold="3"

    grace-visibility="delay: 800">


    <!-- MAP全体 -->
    <a-entity rotation="0 0 0">


      <!-- 白い土台 -->
      <a-plane
        position="0 0.04 0"
        rotation="-90 0 0"
        width="2.7"
        height="2.0"
        color="#ffffff">
      </a-plane>


      <!-- 館内マップ -->
      <a-image
        src="#mapImage"
        position="0 0.055 0"
        rotation="-90 0 0"
        width="2.65"
        height="1.95">
      </a-image>


      <!-- レトロ東京 強調 -->
      <a-box
        position="-0.13 0.14 0.03"
        width="0.72"
        height="0.16"
        depth="0.62"
        material="
          color: #ff3b30;
          opacity: 0.38;
          transparent: true;">
      </a-box>


      <!-- 現在地ピン -->
      <a-cone
        position="-0.13 0.42 0.03"
        radius-bottom="0.11"
        radius-top="0"
        height="0.25"
        rotation="180 0 0"
        color="#e60012">
      </a-cone>


      <a-sphere
        position="-0.13 0.59 0.03"
        radius="0.105"
        color="#e60012">
      </a-sphere>


      <!-- 現在地ラベル -->
      <a-entity
        position="-0.13 0.85 0.03">

        <a-plane
          width="0.95"
          height="0.33"
          color="#ffffff"
          opacity="0.92">
        </a-plane>

        <a-text
          value="YOU ARE HERE"
          position="0 0.055 0.01"
          align="center"
          width="1.7"
          color="#e60012">
        </a-text>

        <a-text
          value="RETRO TOKYO"
          position="0 -0.07 0.01"
          align="center"
          width="1.5"
          color="#111111">
        </a-text>

      </a-entity>

    </a-entity>

  </a-marker>


  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
